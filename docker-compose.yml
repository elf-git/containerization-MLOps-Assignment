services:
  fifa-predictor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fifa-2026-predictor
    image: fifa-2026-winner-prediction:latest
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      # Mount data folder to persist predictions generated during simulation
      - ./FIFA-2026-Winner-Prediction-main/FIFA Prediction/data:/app/FIFA-2026-Winner-Prediction-main/FIFA Prediction/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
